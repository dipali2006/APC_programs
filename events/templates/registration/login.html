<!DOCTYPE html>
<html>
<head>

    <title>EventHub Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background-color: #555;
        }

        .signup-section {
            text-align: center;
            margin-top: 25px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .signup-btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 5px;
        }

        .signup-btn:hover {
            background-color: #388E3C;
        }

        .error {
            color: red;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>EventHub Login</h2>

    {% if form.errors %}
        <p class="error">
            Invalid email or password.
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Email</label>

        <input
            type="text"
            name="username"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>


    <div class="signup-section">

        <p>Don't have an account?</p>

        <a href="/signup/" class="signup-btn">
            Sign Up
        </a>

    </div>

</div>

</body>
</html>
